<!DOCTYPE html>
<html>
<body>
  <h3>AI Document Draft</h3>
  <input id="p1" placeholder="Party A">
  <input id="p2" placeholder="Party B">
  <textarea id="t" placeholder="Terms"></textarea>
  <button onclick="gen()">Draft</button>
  <pre id="out"></pre>

  <script>
    async function gen() {
      document.getElementById('out').innerText = "Drafting...";
      const res = await fetch('https://openai.com', {
        method: 'POST',
        headers: {'Content-Type': 'application/json', 'Authorization': 'Bearer OPENAI_KEY'},
        body: JSON.stringify({
          model: 'gpt-4o-mini',
          messages: [{role: 'user', content: `Draft an NDA between ${p1.value} and ${p2.value} with terms: ${t.value}`}]
        })
      });
      const data = await res.json();
      out.innerText = data.choices[0].message.content;
    }
  </script>
</body>
</html>
